<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3c72">
    <title>Dashboard - Sistema Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; min-height: 100vh; padding-bottom: 20px; }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 12px 14px; display: flex; justify-content: space-between;
            align-items: center; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .qr-btn {
            background: white; border: none; width: 40px; height: 40px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.18);
        }
        .qr-btn i { font-size: 20px; color: #1e3c72; }
        .notificar-btn {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white; text-decoration: none; padding: 8px 12px;
            border-radius: 25px; display: flex; align-items: center; gap: 5px;
            font-size: 0.85em; font-weight: 600;
            box-shadow: 0 3px 8px rgba(229,62,62,0.25);
        }
        .header-title { flex: 1; text-align: center; }
        .greeting { color: white; font-size: 1.05em; font-weight: 500; }
        .header-right { position: relative; }
        .account-btn {
            background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.25);
            color: white; width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer;
        }
        
        /* Dropdown */
        .account-dropdown {
            position: fixed; top: 65px; right: 14px;
            background: white; border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            min-width: 250px; display: none; overflow: hidden; z-index: 9999;
        }
        .account-dropdown.show { display: block; }
        .dropdown-header {
            padding: 20px 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; text-align: center;
        }
        .dropdown-avatar {
            width: 60px; height: 60px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; color: #667eea; font-size: 38px;
        }
        .dropdown-header h3 { font-size: 1.1em; margin-bottom: 4px; }
        .dropdown-header p { font-size: 0.85em; opacity: 0.9; }
        .dropdown-menu { padding: 8px 0; }
        .dropdown-item {
            padding: 15px 20px; display: flex; align-items: center; gap: 14px;
            color: #1e293b; text-decoration: none; font-size: 1.05em;
            font-weight: 500; border-bottom: 1px solid #f0f0f0;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item.logout { color: #e53e3e; }
        .dropdown-divider { height: 1px; background: #e8e8e8; margin: 6px 0; }
        .notification-badge {
            background: #ef4444; color: white; font-size: 0.7em; font-weight: 700;
            padding: 2px 8px; border-radius: 20px; margin-left: auto;
        }
        
        /* Overlay */
        .overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 99;
        }
        .overlay.show { display: block; }
        
        /* Stats */
        .stats-wrapper {
            position: sticky; top: 64px; z-index: 90;
            background: #f0f4f8; padding: 10px 14px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }
        .stats-container { display: flex; gap: 8px; max-width: 600px; margin: 0 auto; }
        .stat-card {
            flex: 1; border-radius: 14px; padding: 10px 8px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }
        .stat-card.merito-card { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); }
        .stat-card.demerito-card { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .stat-card.balance-card { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .stat-icon {
            width: 30px; height: 30px; background: rgba(255,255,255,0.5);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #1e3c72;
        }
        .stat-info { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.6em; font-weight: 700; color: rgba(0,0,0,0.5); text-transform: uppercase; }
        .stat-value { font-size: 1.3em; font-weight: 800; color: #1e3c72; line-height: 1.2; }
        .stat-value.positive { color: #059669; }
        .stat-value.negative { color: #dc2626; }
        
        /* Main Content */
        .main-content { padding: 18px 14px; max-width: 600px; margin: 0 auto; }
        
        /* Welcome */
        .welcome-section {
            background: white; border-radius: 22px; padding: 20px 18px;
            margin-bottom: 18px; box-shadow: 0 5px 18px rgba(0,0,0,0.04);
        }
        .welcome-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
        .welcome-section h1 { color: #1e3c72; font-size: 1.5em; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .wave { animation: wave 1.5s infinite; }
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(18deg); }
            75% { transform: rotate(-12deg); }
        }
        .welcome-text { color: #555; font-size: 0.9em; }
        .last-update { color: #888; font-size: 0.7em; margin-top: 5px; display: flex; align-items: center; gap: 4px; }
        .user-badge {
            display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 5px 12px; border-radius: 25px; font-size: 0.8em; font-weight: 600;
        }
        
        /* Buscador */
        .ds-buscador {
            background: #ffffff; border-radius: 20px; padding: 20px 18px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .section-title { font-size: 1.2em; color: #1e3c72; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .ds-buscador-descripcion { color: #64748b; font-size: 0.9em; margin-left: 28px; margin-bottom: 15px; }
        .ds-search-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .ds-search-input-wrapper { flex: 1; position: relative; }
        .ds-search-input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1.1em; }
        .ds-search-form input {
            width: 100%; padding: 14px 16px 14px 45px; border: 2px solid #e2e8f0;
            border-radius: 14px; font-family: 'Poppins', sans-serif; font-size: 1em; background: white;
        }
        .ds-search-form input:focus { outline: none; border-color: #1e3c72; box-shadow: 0 0 0 3px rgba(30,60,114,0.08); }
        .ds-search-btn {
            padding: 14px 24px; background: #1e3c72; color: white; border: none;
            border-radius: 14px; font-weight: 600; font-size: 1em; cursor: pointer; white-space: nowrap;
        }
        .ds-resultados-container { margin-top: 15px; }
        .ds-resultados-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
        .ds-resultados-count { font-weight: 600; color: #1e293b; font-size: 0.95em; }
        .ds-btn-limpiar { background: none; border: none; color: #64748b; font-size: 0.9em; cursor: pointer; padding: 6px 12px; border-radius: 20px; }
        .ds-resultados-list { display: flex; flex-direction: column; gap: 14px; max-height: 450px; overflow-y: auto; }
        .ds-estudiante-card { display: flex; gap: 15px; background: #f8fafc; border-radius: 18px; padding: 16px; border: 1px solid #e2e8f0; }
        .ds-estudiante-avatar {
            width: 52px; height: 52px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 26px; flex-shrink: 0;
        }
        .ds-estudiante-content { flex: 1; min-width: 0; }
        .ds-estudiante-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; flex-wrap: wrap; gap: 5px; }
        .ds-estudiante-nombre { font-size: 1.1em; font-weight: 700; color: #1e293b; }
        .ds-estudiante-ci { font-size: 0.8em; color: #64748b; background: #e2e8f0; padding: 3px 10px; border-radius: 20px; }
        .ds-estudiante-detalles { display: flex; gap: 15px; margin-bottom: 12px; }
        .ds-detalle-item { display: flex; align-items: center; gap: 5px; font-size: 0.85em; color: #64748b; }
        .ds-estudiante-stats { display: flex; gap: 15px; margin-bottom: 14px; padding: 10px; background: white; border-radius: 14px; }
        .ds-stat-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .ds-stat-icon { font-size: 18px; }
        .ds-stat-value { font-size: 1.2em; font-weight: 800; color: #1e293b; }
        .ds-stat-label { font-size: 0.65em; color: #64748b; text-transform: uppercase; }
        .ds-stat-item.merito .ds-stat-value { color: #10b981; }
        .ds-stat-item.demerito .ds-stat-value { color: #ef4444; }
        .ds-estudiante-actions { display: flex; gap: 10px; }
        .ds-action-btn {
            flex: 1; padding: 10px 14px; border-radius: 12px; text-decoration: none;
            font-weight: 600; font-size: 0.85em; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .ds-action-btn.primary { background: #1e3c72; color: white; }
        .ds-action-btn.secondary { background: #e2e8f0; color: #1e293b; }
        .ds-empty-results { text-align: center; padding: 35px 20px; }
        .ds-empty-results i { font-size: 50px; color: #cbd5e1; margin-bottom: 12px; }
        .ds-empty-results h3 { color: #64748b; margin-bottom: 6px; font-size: 1.1em; }
        .ds-buscador-placeholder { text-align: center; padding: 35px 20px; color: #94a3b8; }
        .ds-buscador-placeholder i { font-size: 45px; color: #cbd5e1; margin-bottom: 12px; }
                /* Actividades */
        .semana-section {
            background: white; border-radius: 22px; padding: 18px 16px;
            margin-bottom: 18px; box-shadow: 0 5px 18px rgba(0,0,0,0.04);
        }
        .semana-fecha { font-size: 0.65em; color: #64748b; margin-left: 5px; }
        .actividad-list { display: flex; flex-direction: column; gap: 10px; }
        .actividad-item {
            background: #f8fafc; border-radius: 16px; padding: 14px;
            display: flex; align-items: flex-start; gap: 12px; border-left: 4px solid;
        }
        .actividad-item.merito {
            border-left-color: #10b981;
            background: linear-gradient(90deg, #f0fdf4 0%, #f8fafc 100%);
        }
        .actividad-item.demerito {
            border-left-color: #ef4444;
            background: linear-gradient(90deg, #fef2f2 0%, #f8fafc 100%);
        }
        .actividad-icon {
            width: 38px; height: 38px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .actividad-item.merito .actividad-icon { background: #d1fae5; color: #065f46; }
        .actividad-item.demerito .actividad-icon { background: #fee2e2; color: #991b1b; }
        .actividad-info { flex: 1; }
        .actividad-titulo { font-size: 1em; font-weight: 600; color: #1e293b; margin-bottom: 3px; }
        .actividad-subtitulo { font-size: 0.78em; color: #64748b; margin-bottom: 6px; }
        .actividad-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .actividad-valor {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
            border-radius: 20px; font-weight: 700; font-size: 0.9em;
        }
        .actividad-valor.merito { background: #d1fae5; color: #065f46; }
        .actividad-valor.demerito { background: #fee2e2; color: #991b1b; }
        .actividad-fecha, .actividad-hora { display: flex; align-items: center; gap: 4px; color: #64748b; font-size: 0.78em; }
        .empty-state-small { text-align: center; padding: 20px; color: #94a3b8; }
        .actividad-notificador { display: flex; align-items: center; gap: 4px; font-size: 0.75em; color: #64748b; margin-bottom: 4px; }
        .actividad-notificador strong { color: #475569; }
        
        /* Panel Profesor/Oficial */
        .panel-cargo {
            background: white; border-radius: 24px; padding: 30px 20px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .panel-icon { font-size: 60px; margin-bottom: 15px; }
        .panel-cargo h2 { color: #1e3c72; margin-bottom: 10px; }
        .panel-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .panel-btn {
            background: #f0f4f8; color: #1e3c72; padding: 16px;
            border-radius: 16px; text-decoration: none; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        
        /* Modal QR */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.75);
            justify-content: center; align-items: flex-end; z-index: 9999;
        }
        .modal.show { display: flex; }
        .qr-modal-content {
            background: white; border-radius: 32px 32px 0 0;
            padding: 28px 22px; max-width: 420px; width: 100%;
            text-align: center; position: relative;
        }
        .modal-close {
            position: absolute; top: 18px; right: 18px;
            background: #f0f0f0; border: none; width: 36px; height: 36px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .qr-modal-content h2 { color: #1e3c72; margin-bottom: 20px; font-size: 1.6em; }
        .qr-wrapper {
            background: white; padding: 16px; border-radius: 20px;
            display: inline-block; box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        .qr-code canvas, .qr-code img { width: 200px !important; height: 200px !important; }
        .qr-user-name { font-size: 1em; font-weight: 600; color: #1e3c72; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
        .user-qr-info { margin: 15px 0; color: #475569; }
        .btn-download {
            background: #1e3c72; color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-size: 1em; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
        }
        
        /* Alarma */
        .alarma-banner {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white; padding: 14px 18px; border-radius: 16px; margin-bottom: 18px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 4px 15px rgba(220,38,38,0.3);
            border-left: 5px solid #fecaca;
        }
        .alarma-banner i { font-size: 24px; }
        .alarma-banner-content { display: flex; flex-direction: column; gap: 2px; }
        .alarma-banner-content strong { font-size: 1em; }
        .alarma-banner-content span { font-size: 0.85em; opacity: 0.95; }
        
        body.modo-alerta .balance-card {
            border: 2px solid #ef4444;
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%) !important;
        }
        body.modo-alerta .balance-card .stat-icon { background: rgba(239,68,68,0.2); color: #dc2626; }
        body.modo-alerta .balance-card .stat-value { color: #dc2626 !important; font-weight: 900; }
        
        /* Toast notificaciones tiempo real */
        #toastContainer {
            position: fixed; top: 70px; left: 10px; right: 10px;
            z-index: 99999; display: flex; flex-direction: column;
            gap: 8px; pointer-events: none; max-width: 400px;
        }
        
        /* Loading */
        .loading-screen {
            display: flex; justify-content: center; align-items: center;
            min-height: 60vh; flex-direction: column; gap: 15px;
        }
        .loading-screen .spinner {
            width: 50px; height: 50px; border: 4px solid #e2e8f0;
            border-top-color: #1e3c72; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 480px) {
            .ds-search-form { flex-direction: column; }
            .ds-search-btn { padding: 14px; width: 100%; }
            .ds-estudiante-card { flex-direction: column; }
            .ds-estudiante-actions { flex-direction: column; }
            .qr-code canvas, .qr-code img { width: 180px !important; height: 180px !important; }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <header class="header">
        <div class="header-left">
            <button class="qr-btn" id="qrBtn"><i class="fas fa-qrcode"></i></button>
            <a href="notificar.html" class="notificar-btn" id="notificarLink">
                <i class="fas fa-bell"></i> Notificar
            </a>
        </div>
        <div class="header-title">
            <span class="greeting" id="greetingText">Hola, Usuario</span>
        </div>
        <div class="header-right">
            <button class="account-btn" id="accountBtn">
                <i class="fas fa-user"></i><i class="fas fa-chevron-down"></i>
            </button>
            <div class="account-dropdown" id="accountDropdown">
                <div class="dropdown-header">
                    <div class="dropdown-avatar"><i class="fas fa-user"></i></div>
                    <h3 id="dropdownNombre">Usuario</h3>
                    <p id="dropdownCargo">estudiante</p>
                </div>
                <div class="dropdown-menu">
                    <a href="perfil.html" class="dropdown-item"><i class="fas fa-user"></i> Mi Perfil</a>
                    <a href="configuracion.html" class="dropdown-item"><i class="fas fa-cog"></i> Configuracion</a>
                    <a href="mis-notificaciones.html" class="dropdown-item" id="linkNotificaciones">
                        <i class="fas fa-bell"></i> Mis Notificaciones
                        <span class="notification-badge" id="badgeNotificaciones" style="display:none;">0</span>
                    </a>
                    <a href="horario.html" class="dropdown-item"><i class="fas fa-calendar"></i> Horario</a>
                    <a href="tabla-meritos.html" class="dropdown-item"><i class="fas fa-table"></i> Tabla meritos y demeritos</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesion</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Stats (solo estudiantes) -->
    <div class="stats-wrapper" id="statsWrapper" style="display:none;">
        <div class="stats-container">
            <div class="stat-card merito-card">
                <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                <div class="stat-info"><span class="stat-label">Mer. Sem</span><span class="stat-value" id="statMeritos">0</span></div>
            </div>
            <div class="stat-card demerito-card">
                <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="stat-info"><span class="stat-label">Dem. Sem</span><span class="stat-value" id="statDemeritos">0</span></div>
            </div>
            <div class="stat-card balance-card">
                <div class="stat-icon"><i class="fas fa-balance-scale"></i></div>
                <div class="stat-info"><span class="stat-label">Bal. Sem</span><span class="stat-value" id="statBalance">0</span></div>
            </div>
        </div>
    </div>

    <main class="main-content" id="mainContent">
        <!-- Loading inicial -->
        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <p style="color: #64748b;">Cargando dashboard...</p>
        </div>
    </main>
    <!-- Modal QR -->
<div class="modal" id="qrModal">
    <div class="qr-modal-content">
        <button class="modal-close" id="closeModalBtn"><i class="fas fa-times"></i></button>
        <h2><i class="fas fa-qrcode"></i> Tu Codigo QR</h2>
        <div class="qr-container">
            <div class="qr-wrapper">
                <div class="qr-code" id="qrCode"></div>
                <div class="qr-user-name" id="qrUserName"></div>
            </div>
        </div>
        <div class="user-qr-info">
            <span><i class="fas fa-id-card"></i> CI: <span id="qrCI"></span></span>
            <span style="margin-left: 15px;"><i class="fas fa-user"></i> <span id="qrCargo"></span></span>
        </div>
        <div class="qr-actions">
            <button class="btn-download" id="downloadQRBtn"><i class="fas fa-download"></i> Descargar QR</button>
        </div>
    </div>
</div>

<!-- Toast Container para tiempo real -->
<div id="toastContainer"></div>

<script src="js/qrcode.min.js"></script>
<script>
    // ============================================
    // CONFIGURACIÓN
    // ============================================
    const API_URL = 'https://tarjetadereporte.infinityfree.me/api/';
    
    // ============================================
    // DATOS DEL USUARIO
    // ============================================
    const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
    const token = localStorage.getItem('token') || '';
    const logueado = localStorage.getItem('logueado') === 'true';
    
    // Redirigir si no hay sesión
    if (!logueado || !token) {
        window.location.href = 'login.html';
    }
    
    // ============================================
    // ELEMENTOS DOM
    // ============================================
    const greetingText = document.getElementById('greetingText');
    const dropdownNombre = document.getElementById('dropdownNombre');
    const dropdownCargo = document.getElementById('dropdownCargo');
    const statsWrapper = document.getElementById('statsWrapper');
    const statMeritos = document.getElementById('statMeritos');
    const statDemeritos = document.getElementById('statDemeritos');
    const statBalance = document.getElementById('statBalance');
    const mainContent = document.getElementById('mainContent');
    const loadingScreen = document.getElementById('loadingScreen');
    const notificarLink = document.getElementById('notificarLink');
    const linkNotificaciones = document.getElementById('linkNotificaciones');
    const badgeNotificaciones = document.getElementById('badgeNotificaciones');
    const qrUserName = document.getElementById('qrUserName');
    const qrCI = document.getElementById('qrCI');
    const qrCargo = document.getElementById('qrCargo');
    
    // ============================================
    // ACTUALIZAR UI CON DATOS DEL USUARIO
    // ============================================
    function actualizarUIUsuario() {
        const nombreCompleto = (usuario.nombre || '') + ' ' + (usuario.apellidos || '');
        greetingText.textContent = 'Hola, ' + (usuario.nombre || 'Usuario');
        dropdownNombre.textContent = nombreCompleto.trim() || 'Usuario';
        dropdownCargo.textContent = usuario.cargo || 'estudiante';
        
        // Mostrar/ocultar stats según cargo
        if (usuario.cargo === 'estudiante') {
            statsWrapper.style.display = 'block';
        }
        
        // Mostrar/ocultar botón notificar según cargo
        if (usuario.cargo === 'estudiante') {
            const ocupacion = usuario.ocupacion || '';
            if (ocupacion === 'ninguno' || ocupacion === '') {
                notificarLink.style.display = 'none';
            }
        }
        
        // Datos QR
        qrUserName.textContent = nombreCompleto.trim();
        qrCI.textContent = usuario.ci || '';
        qrCargo.textContent = usuario.cargo || '';
    }
    
    // ============================================
    // CARGAR DASHBOARD DESDE API
    // ============================================
    async function cargarDashboard() {
        try {
            const response = await fetch(API_URL + 'dashboard.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            
            const data = await response.json();
            
            if (!data.success) {
                // Token inválido
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            
            // Actualizar datos del usuario
            if (data.usuario) {
                Object.assign(usuario, data.usuario);
                localStorage.setItem('usuario', JSON.stringify(usuario));
            }
            
            actualizarUIUsuario();
            renderizarDashboard(data);
            
        } catch (error) {
            console.error('Error al cargar dashboard:', error);
            // Intentar con datos locales
            actualizarUIUsuario();
            mainContent.innerHTML = '<div class="welcome-section"><div class="welcome-header"><h1><span class="wave">👋</span> Bienvenido!</h1><span class="user-badge"><i class="fas fa-user"></i> ' + (usuario.cargo || '') + '</span></div><p class="welcome-text">Panel de control del sistema escolar</p><p class="last-update"><i class="fas fa-clock"></i> Sin conexion</p></div><p style="text-align:center;color:#ef4444;">Error de conexion. Intenta de nuevo.</p>';
        }
    }
    
    // ============================================
    // RENDERIZAR DASHBOARD
    // ============================================
    function renderizarDashboard(data) {
        loadingScreen.style.display = 'none';
        
        let html = '';
        
        // Welcome
        html += '<div class="welcome-section">';
        html += '<div class="welcome-header"><h1><span class="wave">👋</span> Bienvenido!</h1>';
        html += '<span class="user-badge"><i class="fas fa-user"></i> ' + (usuario.cargo || '') + '</span></div>';
        html += '<p class="welcome-text">Panel de control del sistema escolar</p>';
        html += '<p class="last-update"><i class="fas fa-clock"></i> Actualizado: ' + new Date().toLocaleString() + '</p>';
        html += '</div>';
        
        // Alarma
        if (data.alarma_activa) {
            document.body.classList.add('modo-alerta');
            html += '<div class="alarma-banner"><i class="fas fa-exclamation-triangle"></i><div class="alarma-banner-content"><strong>ALARMA ACTIVADA!</strong><span>Has alcanzado el limite de demeritos.</span></div></div>';
        }
        
        // Actualizar stats
        if (data.stats) {
            statMeritos.textContent = data.stats.meritos_semana || 0;
            statDemeritos.textContent = data.stats.demeritos_semana || 0;
            const balance = (data.stats.meritos_semana || 0) - (data.stats.demeritos_semana || 0);
            statBalance.textContent = balance;
            statBalance.className = 'stat-value ' + (balance >= 0 ? 'positive' : 'negative');
        }
        
        // Buscador (para directiva, oficial, profesor)
        if (['directiva', 'oficial', 'profesor'].includes(usuario.cargo) || usuario.ocupacion === 'secretaria') {
            html += '<div class="ds-buscador">';
            html += '<h2 class="section-title"><i class="fas fa-search"></i> Buscar Estudiante</h2>';
            html += '<p class="ds-buscador-descripcion">Busca por nombre, apellidos o CI</p>';
            html += '<div class="ds-search-form">';
            html += '<div class="ds-search-input-wrapper"><i class="fas fa-search"></i><input type="text" id="buscarInput" placeholder="Ej: Juan Perez o 12345678..."></div>';
            html += '<button class="ds-search-btn" onclick="buscarEstudiantes()">Buscar</button>';
            html += '</div>';
            html += '<div id="resultadosBusqueda"></div>';
            html += '</div>';
        }
        
        // Actividades (solo estudiantes)
        if (usuario.cargo === 'estudiante') {
            // Esta semana
            html += '<div class="semana-section">';
            html += '<h2 class="section-title"><i class="fas fa-calendar"></i> Esta Semana<span class="semana-fecha">' + (data.semana_fecha || '') + '</span></h2>';
            html += '<div class="actividad-list" id="actividadList">';
            
            if (!data.semana_actual || data.semana_actual.length === 0) {
                html += '<div class="empty-state-small"><i class="fas fa-check-circle"></i><p>Sin actividades esta semana</p></div>';
            } else {
                data.semana_actual.forEach(function(act) {
                    html += renderActividad(act);
                });
            }
            html += '</div></div>';
            
            // Semanas anteriores
            if (data.semanas_anteriores) {
                for (var fecha in data.semanas_anteriores) {
                    html += '<div class="semana-section" style="opacity:0.9;">';
                    html += '<h2 class="section-title"><i class="fas fa-history"></i> Semana ' + fecha + '</h2>';
                    html += '<div class="actividad-list">';
                    data.semanas_anteriores[fecha].forEach(function(act) {
                        html += renderActividad(act);
                    });
                    html += '</div></div>';
                }
            }
        }
        
        // Panel profesor/oficial
        if (['profesor', 'oficial'].includes(usuario.cargo)) {
            html += '<div class="panel-cargo">';
            html += '<div class="panel-icon">' + (usuario.cargo === 'profesor' ? '👨‍🏫' : '👮') + '</div>';
            html += '<h2>Panel de ' + usuario.cargo + '</h2>';
            html += '<p>Bienvenido al sistema de gestion escolar.</p>';
            html += '<div class="panel-actions">';
            html += '<a href="notificar.html" class="panel-btn"><i class="fas fa-bell"></i> Notificar Actividad</a>';
            html += '<a href="horario.html" class="panel-btn"><i class="fas fa-calendar"></i> Ver Horario</a>';
            html += '</div></div>';
        }
        
        mainContent.innerHTML = html;
        
        // Actualizar badge de notificaciones
        if (data.nuevas_actividades > 0) {
            badgeNotificaciones.style.display = 'inline';
            badgeNotificaciones.textContent = data.nuevas_actividades;
        }
    }
    
    function renderActividad(act) {
        var esMerito = act.tipo === 'merito';
        return '<div class="actividad-item ' + (esMerito ? 'merito' : 'demerito') + '">' +
            '<div class="actividad-icon"><i class="fas fa-' + (esMerito ? 'trophy' : 'exclamation-triangle') + '"></i></div>' +
            '<div class="actividad-info">' +
            '<div class="actividad-titulo">' + (act.falta_causa || 'Sin descripcion') + '</div>' +
            '<div class="actividad-subtitulo">' + (act.categoria || '') + '</div>' +
            '<div class="actividad-notificador"><i class="fas fa-user"></i> Notificado por: <strong>' + (act.notificador || 'Sistema') + '</strong></div>' +
            '<div class="actividad-meta">' +
            '<span class="actividad-valor ' + (esMerito ? 'merito' : 'demerito') + '"><i class="fas fa-' + (esMerito ? 'plus' : 'minus') + '"></i>' + (esMerito ? '+' : '-') + act.cantidad + '</span>' +
            '<span class="actividad-fecha"><i class="fas fa-calendar"></i> ' + act.fecha + '</span>' +
            '<span class="actividad-hora"><i class="fas fa-clock"></i> ' + act.hora + '</span>' +
            '</div></div></div>';
    }
    
            // ============================================
        // BUSCAR ESTUDIANTES
        // ============================================
        async function buscarEstudiantes() {
            const input = document.getElementById('buscarInput');
            const query = input ? input.value.trim() : '';
            const resultadosDiv = document.getElementById('resultadosBusqueda');
            
            if (!query || query.length < 2) {
                resultadosDiv.innerHTML = '<div class="ds-buscador-placeholder"><i class="fas fa-search"></i><p>Ingresa un termino de busqueda</p></div>';
                return;
            }
            
            try {
                const response = await fetch(API_URL + 'buscar.php?q=' + encodeURIComponent(query) + '&token=' + token);
                const data = await response.json();
                
                if (!data.length) {
                    resultadosDiv.innerHTML = '<div class="ds-empty-results"><i class="fas fa-user-slash"></i><h3>No se encontraron estudiantes</h3><p>Intenta con otro nombre</p></div>';
                    return;
                }
                
                let html = '<div class="ds-resultados-header"><span class="ds-resultados-count">' + data.length + ' resultado(s)</span><button class="ds-btn-limpiar" onclick="limpiarBusqueda()">Limpiar</button></div>';
                html += '<div class="ds-resultados-list">';
                
                data.forEach(function(est) {
                    html += '<div class="ds-estudiante-card">';
                    html += '<div class="ds-estudiante-avatar"><i class="fas fa-user"></i></div>';
                    html += '<div class="ds-estudiante-content">';
                    html += '<div class="ds-estudiante-header"><h3 class="ds-estudiante-nombre">' + est.nombre + ' ' + est.apellidos + '</h3><span class="ds-estudiante-ci">CI: ' + est.ci + '</span></div>';
                    html += '<div class="ds-estudiante-detalles"><span class="ds-detalle-item"><i class="fas fa-graduation-cap"></i> ' + est.grado + '</span><span class="ds-detalle-item"><i class="fas fa-users"></i> Peloton ' + (est.peloton || '?') + '</span></div>';
                    html += '<div class="ds-estudiante-stats">';
                    html += '<div class="ds-stat-item merito"><span class="ds-stat-icon"><i class="fas fa-trophy"></i></span><span class="ds-stat-value">' + est.meritos + '</span><span class="ds-stat-label">Meritos</span></div>';
                    html += '<div class="ds-stat-item demerito"><span class="ds-stat-icon"><i class="fas fa-exclamation-triangle"></i></span><span class="ds-stat-value">' + est.demeritos + '</span><span class="ds-stat-label">Demeritos</span></div>';
                    html += '<div class="ds-stat-item"><span class="ds-stat-icon"><i class="fas fa-balance-scale"></i></span><span class="ds-stat-value">' + est.balance + '</span><span class="ds-stat-label">Balance</span></div>';
                    html += '</div>';
                    html += '<div class="ds-estudiante-actions">';
                    html += '<a href="notificar.html?destinatario=' + est.id + '" class="ds-action-btn primary"><i class="fas fa-plus"></i> Reportar</a>';
                    html += '<a href="perfil-estudiante.html?id=' + est.id + '" class="ds-action-btn secondary"><i class="fas fa-eye"></i> Ver Perfil</a>';
                    html += '</div></div></div>';
                });
                
                html += '</div>';
                resultadosDiv.innerHTML = html;
                
            } catch (error) {
                resultadosDiv.innerHTML = '<div class="ds-empty-results"><i class="fas fa-exclamation-triangle"></i><h3>Error de conexion</h3></div>';
            }
        }
        
        function limpiarBusqueda() {
            document.getElementById('buscarInput').value = '';
            document.getElementById('resultadosBusqueda').innerHTML = '<div class="ds-buscador-placeholder"><i class="fas fa-search"></i><p>Ingresa un termino de busqueda</p></div>';
        }
        
        // ============================================
        // DROPDOWN
        // ============================================
        document.getElementById('accountBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('accountDropdown').classList.toggle('show');
            document.getElementById('overlay').classList.toggle('show');
        });
        
        document.getElementById('overlay').addEventListener('click', function() {
            document.getElementById('accountDropdown').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
        });
        
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('accountDropdown');
            const btn = document.getElementById('accountBtn');
            if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                dropdown.classList.remove('show');
                document.getElementById('overlay').classList.remove('show');
            }
        });
        
        // ============================================
        // LOGOUT
        // ============================================
        document.getElementById('btnLogout').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        });
        
        // ============================================
        // QR
        // ============================================
        let qrGenerado = false;
        
        document.getElementById('qrBtn').addEventListener('click', function() {
            document.getElementById('qrModal').classList.add('show');
            if (!qrGenerado) {
                setTimeout(function() {
                    const container = document.getElementById('qrCode');
                    container.innerHTML = '';
                    if (typeof QRCode !== 'undefined') {
                        const qrData = btoa(JSON.stringify({
                            id: usuario.id,
                            nombre: usuario.nombre,
                            apellidos: usuario.apellidos,
                            ci: usuario.ci,
                            cargo: usuario.cargo
                        }));
                        new QRCode(container, {
                            text: qrData, width: 200, height: 200,
                            colorDark: "#1e3c72", colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                        qrGenerado = true;
                    }
                }, 100);
            }
        });
        
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('qrModal').classList.remove('show');
        });
        
        document.getElementById('qrModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('show');
        });
        
        document.getElementById('downloadQRBtn').addEventListener('click', function() {
            const canvas = document.querySelector('#qrCode canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'QR_' + (usuario.nombre || '') + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
        });
        
        // ============================================
        // TIEMPO REAL (SOLO ESTUDIANTES)
        // ============================================
        if (usuario.cargo === 'estudiante') {
            function verificarNuevasActividades() {
                fetch(API_URL + 'check_nuevas.php?token=' + token + '&t=' + Date.now())
                    .then(r => r.json())
                    .then(data => {
                        if (data.nuevas && data.actividades && data.actividades.length > 0) {
                            data.actividades.forEach(function(act) {
                                mostrarToast(act);
                                agregarActividadALista(act);
                            });
                        }
                        if (data.stats) {
                            statMeritos.textContent = data.stats.meritos_semana || 0;
                            statDemeritos.textContent = data.stats.demeritos_semana || 0;
                            const balance = (data.stats.meritos_semana || 0) - (data.stats.demeritos_semana || 0);
                            statBalance.textContent = balance;
                            statBalance.className = 'stat-value ' + (balance >= 0 ? 'positive' : 'negative');
                        }
                    })
                    .catch(() => {});
            }
            
            function mostrarToast(act) {
                const container = document.getElementById('toastContainer');
                const esMerito = act.tipo === 'merito';
                const toast = document.createElement('div');
                toast.style.cssText = 'background:white;border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,0.15);pointer-events:auto;animation:slideIn 0.4s ease;border-left:4px solid ' + (esMerito ? '#10b981' : '#ef4444') + ';';
                toast.innerHTML = '<div style="display:flex;align-items:center;gap:10px;">' +
                    '<div style="width:38px;height:38px;border-radius:10px;background:' + (esMerito ? '#d1fae5' : '#fee2e2') + ';display:flex;align-items:center;justify-content:center;font-size:20px;">' + (esMerito ? '🏆' : '⚠️') + '</div>' +
                    '<div style="flex:1;"><div style="font-weight:700;font-size:0.9em;color:#1e293b;">' + (esMerito ? 'Nuevo Merito' : 'Nuevo Demerito') + '</div>' +
                    '<div style="font-size:0.75em;color:#64748b;">' + (act.falta_causa || '') + ' (' + (esMerito ? '+' : '-') + act.cantidad + ')</div></div>' +
                    '<button onclick="this.parentElement.remove()" style="background:#f1f5f9;border:none;width:26px;height:26px;border-radius:6px;cursor:pointer;">✕</button></div>';
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentElement) { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); } }, 5000);
            }
            
            function agregarActividadALista(act) {
                const lista = document.getElementById('actividadList');
                if (!lista) return;
                const empty = lista.querySelector('.empty-state-small');
                if (empty) empty.remove();
                const div = document.createElement('div');
                div.innerHTML = renderActividad(act);
                lista.insertBefore(div.firstChild, lista.firstChild);
            }
            
            setInterval(verificarNuevasActividades, 5000);
            setTimeout(verificarNuevasActividades, 2000);
        }
        
        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            actualizarUIUsuario();
            cargarDashboard();
        });
        
        // Exponer funciones globales
        window.buscarEstudiantes = buscarEstudiantes;
        window.limpiarBusqueda = limpiarBusqueda;
    </script>
</body>
</html>
