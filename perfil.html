<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3c72">
    <title>Mi Perfil - Sistema Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; min-height: 100vh; padding-bottom: 30px; }
        
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 16px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
        .back-btn { background: rgba(255,255,255,0.15); border: none; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; text-decoration: none; margin-right: 16px; cursor: pointer; }
        .header-title { color: white; font-size: 1.4em; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .main-content { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
        
        /* Perfil Card */
        .perfil-card { background: white; border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); text-align: center; }
        .perfil-avatar {
            width: 90px; height: 90px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; color: white; font-size: 45px;
        }
        .perfil-nombre { font-size: 1.5em; font-weight: 700; color: #1e3c72; margin-bottom: 5px; }
        .perfil-cargo { display: inline-block; background: #e2e8f0; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; color: #64748b; margin-bottom: 15px; }
        .perfil-detalles { display: flex; justify-content: center; gap: 20px; margin-top: 10px; color: #64748b; font-size: 0.9em; flex-wrap: wrap; }
        .perfil-detalles span { display: flex; align-items: center; gap: 5px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .stat-box { background: #f8fafc; border-radius: 16px; padding: 16px 10px; text-align: center; }
        .stat-box .icon { font-size: 28px; margin-bottom: 8px; }
        .stat-box.merito .icon { color: #10b981; }
        .stat-box.demerito .icon { color: #ef4444; }
        .stat-box.balance .icon { color: #667eea; }
        .stat-valor { font-size: 1.8em; font-weight: 800; color: #1e3c72; }
        .stat-label { font-size: 0.8em; color: #64748b; text-transform: uppercase; }
        
        /* Mensaje Estado */
        .mensaje-estado { padding: 20px; border-radius: 20px; text-align: center; margin-top: 20px; color: white; }
        .mensaje-estado.excelente { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .mensaje-estado.atencion { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .mensaje-estado.equilibrado { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .mensaje-estado i { font-size: 40px; margin-bottom: 10px; }
        .mensaje-estado h3 { font-size: 1.3em; margin-bottom: 5px; }
        .mensaje-estado p { font-size: 0.9em; opacity: 0.95; }
        
        /* Secciones */
        .seccion-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .seccion-titulo { color: #1e3c72; font-size: 1.2em; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        /* Categorías */
        .categoria-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
        .categoria-item:last-child { border-bottom: none; }
        .categoria-nombre { color: #1e293b; }
        .categoria-total { font-weight: 700; }
        .categoria-total.merito { color: #10b981; }
        .categoria-total.demerito { color: #ef4444; }
        
        /* Actividades Mini */
        .actividad-mini { padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .actividad-mini.merito { background: #d1fae5; }
        .actividad-mini.demerito { background: #fee2e2; }
        .actividad-mini-info { flex: 1; }
        .actividad-mini-nombre { font-weight: 600; color: #1e293b; font-size: 0.95em; }
        .actividad-mini-fecha { font-size: 0.75em; color: #64748b; }
        .actividad-mini-valor { font-weight: 700; font-size: 1.1em; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 30px; color: #94a3b8; }
        .empty-state i { font-size: 40px; margin-bottom: 10px; }
        .empty-state p { font-size: 0.95em; }
        
        /* Loading */
        .loading-screen {
            display: flex; justify-content: center; align-items: center;
            min-height: 60vh; flex-direction: column; gap: 15px;
        }
        .loading-screen .spinner {
            width: 50px; height: 50px; border: 4px solid #e2e8f0;
            border-top-color: #1e3c72; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-screen p { color: #64748b; }
        
        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px);
            background: white; border-radius: 16px; padding: 14px 18px; display: flex;
            align-items: center; gap: 12px; z-index: 99999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 400px; width: 90%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-left: 5px solid #10b981; }
        .toast.error { border-left: 5px solid #ef4444; }
        .toast-icon {
            width: 40px; height: 40px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .toast.success .toast-icon { background: #d1fae5; color: #065f46; }
        .toast.error .toast-icon { background: #fee2e2; color: #991b1b; }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 700; font-size: 0.95em; margin-bottom: 2px; }
        .toast.success .toast-title { color: #065f46; }
        .toast.error .toast-title { color: #991b1b; }
        .toast-text { color: #64748b; font-size: 0.8em; }
        .toast-close {
            background: #f1f5f9; border: none; width: 30px; height: 30px;
            border-radius: 8px; color: #64748b; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        
        @media (max-width: 480px) {
            .main-content { padding: 15px 12px; }
            .perfil-card { padding: 20px 16px; }
            .perfil-avatar { width: 75px; height: 75px; font-size: 38px; }
            .perfil-nombre { font-size: 1.3em; }
            .stats-grid { gap: 8px; }
            .stat-box { padding: 12px 8px; }
            .stat-valor { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1 class="header-title"><i class="fas fa-user"></i> Mi Perfil</h1>
    </header>

    <main class="main-content" id="mainContent">
        <!-- Loading -->
        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <p>Cargando perfil...</p>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon"><i class="fas fa-check-circle"></i></div>
        <div class="toast-content">
            <div class="toast-title" id="toastTitle"></div>
            <div class="toast-text" id="toastText"></div>
        </div>
        <button class="toast-close" onclick="hideToast()"><i class="fas fa-times"></i></button>
    </div>
    <script>
    // ============================================
    // CONFIGURACIÓN
    // ============================================
    const API_URL = 'https://tarjetadereporte.infinityfree.me/api/';
    const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
    const token = localStorage.getItem('token') || '';
    
    if (!token) { window.location.href = 'login.html'; }
    
    // ============================================
    // ELEMENTOS
    // ============================================
    const mainContent = document.getElementById('mainContent');
    const loadingScreen = document.getElementById('loadingScreen');
    const toast = document.getElementById('toast');
    
    // ============================================
    // TOAST
    // ============================================
    function showToast(type, title, text) {
        const toastEl = document.getElementById('toast');
        const icon = document.getElementById('toastIcon');
        const titleEl = document.getElementById('toastTitle');
        const textEl = document.getElementById('toastText');
        
        toastEl.className = 'toast ' + type;
        icon.innerHTML = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-circle"></i>';
        titleEl.textContent = title;
        textEl.textContent = text;
        toastEl.classList.add('show');
        setTimeout(() => { toastEl.classList.remove('show'); }, 3000);
    }
    
    window.hideToast = function() {
        document.getElementById('toast').classList.remove('show');
    };
    
    // ============================================
    // CARGAR PERFIL
    // ============================================
    async function cargarPerfil() {
        try {
            const response = await fetch(API_URL + 'perfil.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            
            const data = await response.json();
            
            if (!data.success) {
                localStorage.clear();
                window.location.href = 'login.html';
                return;
            }
            
            renderizarPerfil(data);
            
        } catch (error) {
            console.error('Error:', error);
            loadingScreen.innerHTML = '<i class="fas fa-exclamation-triangle" style="font-size:50px;color:#ef4444;"></i><p style="color:#ef4444;">Error de conexion</p><button onclick="cargarPerfil()" style="padding:10px 20px;background:#1e3c72;color:white;border:none;border-radius:10px;cursor:pointer;">Reintentar</button>';
        }
    }
    
    // ============================================
    // RENDERIZAR PERFIL
    // ============================================
    function renderizarPerfil(data) {
        loadingScreen.style.display = 'none';
        
        const perfil = data.perfil || usuario;
        const stats = data.stats || {};
        const meritosCat = data.meritos_por_categoria || [];
        const demeritosCat = data.demeritos_por_categoria || [];
        const ultimas = data.ultimas_actividades || [];
        const balance = (stats.meritos || 0) - (stats.demeritos || 0);
        
        let html = '';
        
        // Tarjeta principal
        html += '<div class="perfil-card">';
        html += '<div class="perfil-avatar"><i class="fas fa-user"></i></div>';
        html += '<h2 class="perfil-nombre">' + (perfil.nombre || '') + ' ' + (perfil.apellidos || '') + '</h2>';
        html += '<span class="perfil-cargo">' + (perfil.cargo || 'estudiante');
        if (perfil.ocupacion && perfil.ocupacion !== 'ninguno') {
            html += ' - ' + perfil.ocupacion.replace(/_/g, ' ');
        }
        html += '</span>';
        
        // Detalles (solo estudiantes)
        if (perfil.cargo === 'estudiante') {
            html += '<div class="perfil-detalles">';
            html += '<span><i class="fas fa-graduation-cap"></i> ' + (perfil.grado || '') + '</span>';
            html += '<span><i class="fas fa-users"></i> Pelotón ' + (perfil.peloton || '?') + '</span>';
            html += '<span><i class="fas fa-id-card"></i> CI: ' + (perfil.ci || '') + '</span>';
            html += '</div>';
            
            // Stats
            html += '<div class="stats-grid">';
            html += '<div class="stat-box merito"><div class="icon"><i class="fas fa-trophy"></i></div><div class="stat-valor">' + (stats.meritos || 0) + '</div><div class="stat-label">Méritos</div></div>';
            html += '<div class="stat-box demerito"><div class="icon"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-valor">' + (stats.demeritos || 0) + '</div><div class="stat-label">Deméritos</div></div>';
            html += '<div class="stat-box balance"><div class="icon"><i class="fas fa-balance-scale"></i></div><div class="stat-valor" style="color:' + (balance >= 0 ? '#10b981' : '#ef4444') + '">' + balance + '</div><div class="stat-label">Balance</div></div>';
            html += '</div>';
            
            // Mensaje estado
            if (balance > 0) {
                html += '<div class="mensaje-estado excelente"><i class="fas fa-trophy"></i><h3>¡Excelente!</h3><p>Tienes más méritos que deméritos. ¡Sigue así!</p></div>';
            } else if (balance < 0) {
                html += '<div class="mensaje-estado atencion"><i class="fas fa-exclamation-triangle"></i><h3>Atención</h3><p>Tienes más deméritos que méritos. ¡Esfuérzate más!</p></div>';
            } else {
                html += '<div class="mensaje-estado equilibrado"><i class="fas fa-balance-scale"></i><h3>Equilibrado</h3><p>Tus méritos y deméritos están igualados.</p></div>';
            }
        }
        html += '</div>';
                    // Méritos por categoría (solo estudiantes)
            if (perfil.cargo === 'estudiante') {
                html += '<div class="seccion-card">';
                html += '<h3 class="seccion-titulo"><i class="fas fa-trophy" style="color:#10b981;"></i> Méritos por Categoría</h3>';
                if (meritosCat.length === 0) {
                    html += '<div class="empty-state"><i class="fas fa-inbox"></i><p>No hay méritos registrados</p></div>';
                } else {
                    meritosCat.forEach(cat => {
                        html += '<div class="categoria-item"><span class="categoria-nombre">' + cat.categoria + '</span><span class="categoria-total merito">+' + cat.total + '</span></div>';
                    });
                }
                html += '</div>';
                
                // Deméritos por categoría
                html += '<div class="seccion-card">';
                html += '<h3 class="seccion-titulo"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i> Deméritos por Categoría</h3>';
                if (demeritosCat.length === 0) {
                    html += '<div class="empty-state"><i class="fas fa-inbox"></i><p>No hay deméritos registrados</p></div>';
                } else {
                    demeritosCat.forEach(cat => {
                        html += '<div class="categoria-item"><span class="categoria-nombre">' + cat.categoria + '</span><span class="categoria-total demerito">-' + cat.total + '</span></div>';
                    });
                }
                html += '</div>';
            }
            
            // Últimas actividades
            html += '<div class="seccion-card">';
            html += '<h3 class="seccion-titulo"><i class="fas fa-history"></i> Últimas Actividades</h3>';
            if (ultimas.length === 0) {
                html += '<div class="empty-state"><i class="fas fa-inbox"></i><p>No hay actividades recientes</p></div>';
            } else {
                ultimas.forEach(act => {
                    const esMerito = act.tipo === 'merito';
                    html += '<div class="actividad-mini ' + (esMerito ? 'merito' : 'demerito') + '">';
                    html += '<div class="actividad-mini-info">';
                    html += '<div class="actividad-mini-nombre">' + (act.falta_causa || 'Sin descripción') + '</div>';
                    html += '<div class="actividad-mini-fecha">' + formatearFecha(act.fecha) + ' - Notificado por: ' + (act.notificador || 'Sistema') + '</div>';
                    html += '</div>';
                    html += '<div class="actividad-mini-valor" style="color:' + (esMerito ? '#065f46' : '#991b1b') + '">' + (esMerito ? '+' : '-') + act.cantidad + '</div>';
                    html += '</div>';
                });
            }
            html += '</div>';
            
            mainContent.innerHTML = html;
        }
        
        // ============================================
        // FORMATEAR FECHA
        // ============================================
        function formatearFecha(fecha) {
            if (!fecha) return '';
            const d = new Date(fecha);
            if (isNaN(d.getTime())) return fecha;
            return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
        }
        
        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            cargarPerfil();
        });
    </script>
</body>
</html>
